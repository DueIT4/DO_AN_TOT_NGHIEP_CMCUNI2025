# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Cài đặt Flutter SDK
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0' # Phiên bản phù hợp với SDK 3.4.0 của bạn

      # 2. Tải các thư viện (Phải có working-directory)
      - name: Get dependencies
        working-directory: frontend/mobile_web_flutter
        run: flutter pub get

      # 3. Build Web (Phải có working-directory)
      - name: Build Web Application
        working-directory: frontend/mobile_web_flutter
        run: flutter build web -t lib/main.dart --web-renderer canvaskit --release

      # 4. Deploy lên Firebase
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_PLANT_HEALTH_65293 }}
          channelId: live
          projectId: ai-plant-health-65293
          # Chỉ định thư mục chứa kết quả build để Firebase tìm thấy index.html
          entryPoint: frontend/mobile_web_flutter 