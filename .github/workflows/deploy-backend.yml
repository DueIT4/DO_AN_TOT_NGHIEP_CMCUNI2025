name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Chỉ chạy khi bạn sửa code trong thư mục backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker Image
        run: |
          gcloud auth configure-docker
          # Lệnh này sẽ đóng gói code trong thư mục backend thành Docker image
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/zestguard-api ./backend
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/zestguard-api

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy zestguard-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/zestguard-api \
            --region asia-southeast1 \
            --platform managed \
            --allow-unauthenticated